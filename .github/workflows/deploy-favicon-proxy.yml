name: Deploy Favicon Proxy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/favicon-proxy/**
      - .github/workflows/deploy-favicon-proxy.yml

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: favicon-proxy-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/favicon-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - run: pnpm install --ignore-workspace
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
