name: Deploy Favicon Proxy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/favicon-proxy/**
      - .github/workflows/deploy-favicon-proxy.yml

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: favicon-proxy-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/favicon-proxy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"

      - run: pnpm install --ignore-workspace
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
