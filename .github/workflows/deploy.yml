# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check for 'no-deploy' label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Search for the PR associated with this commit
          LABELS=$(gh pr list \
            --search "${{ github.sha }}" \
            --state merged \
            --json labels \
            --jq '.[0].labels // [] | .[].name')

          echo "Labels found: $LABELS"

          if echo "$LABELS" | grep -q "no-deploy"; then
            echo "PR had label 'no-deploy'. Exiting with 78."
            exit 78
          fi

      - run: corepack enable
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
      - run: pnpm install
      - name: Build
        run: pnpm build
        env:
          SVELTE_KIT_BASE_PATH: /tools
          PUBLIC_FAVICON_PROXY_BASE: ${{ vars.PUBLIC_FAVICON_PROXY_BASE }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./build
  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
