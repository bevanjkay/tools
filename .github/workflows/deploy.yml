# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}
jobs:
  labels:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      - name: Check for 'no-deploy' label
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Search for the PR associated with this commit
          LABELS=$(gh pr list \
            --search "$SHA" \
            --state merged \
            --json labels \
            --jq '.[0].labels // [] | .[].name')

          echo "Labels found: $LABELS"

          # Skipping the dependent jobs keeps the run green; a non-zero exit
          # here would mark it failed (the neutral exit code 78 is long gone).
          if grep -qx "no-deploy" <<< "$LABELS"; then
            echo "PR had label 'no-deploy'. Skipping deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: labels
    if: needs.labels.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: pnpm install
      - name: Build
        run: pnpm build
        env:
          SVELTE_KIT_ORIGIN: https://tools.bevankay.me
          PUBLIC_FAVICON_PROXY_BASE: ${{ vars.PUBLIC_FAVICON_PROXY_BASE }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./build
  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
