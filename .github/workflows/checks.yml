name: Pull Request Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency: checks-${{ github.ref }}

permissions: {}

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - run: pnpm install
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - run: pnpm install --ignore-workspace --ignore-scripts
        working-directory: cloudflare/favicon-proxy
      - run: pnpm run check
        working-directory: cloudflare/favicon-proxy
